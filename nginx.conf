# Serves the static APT/RPM repo tree assembled by aggregate.sh.
# Destined for /etc/nginx/conf.d/default.conf in the final serve stage.
#
# gzip off: never re-compress APT/RPM metadata on the fly. Packages.gz is served
# as its stored bytes with no injected Content-Encoding — a second gzip layer
# would break `apt update` ("Hash Sum mismatch"). Edge cache/compression rules
# for repo metadata live in Cloudflare (D-07), not here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    gzip off;

    location / {
        try_files $uri $uri/ =404;
    }
}
