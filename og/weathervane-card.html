<!doctype html>
<!--
  Source for public/weathervane-og.png — the weathervane project link-preview card.
  Crisp text overlaid on the shared art in og/art/card-bg.png ({{CARD_BG}}).
  {{WEATHERVANE_VERSION}} is injected from the live crates.io release by render-og.mjs.
  Edit this file, then run:  node og/render-og.mjs weathervane
  Canvas is exactly 1200x630 (Open Graph / Twitter summary_large_image).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
    />
    <style>
      :root {
        --ink: #e8ecf2;
        --ink-2: #c6ccd6;
        --ink-3: #9aa2af;
        --ink-5: #7e8595;
        --accent: #1793d1;
        --accent-2: #3aabe4;
        --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        font-family: var(--sans);
        color: var(--ink);
        background-color: #0b0e13;
        background-image:
          linear-gradient(90deg, rgba(4, 6, 10, 0.94) 0%, rgba(4, 6, 10, 0.82) 42%, rgba(4, 6, 10, 0.35) 66%, rgba(4, 6, 10, 0) 100%),
          url('{{CARD_BG}}');
        background-size: cover, cover;
        background-position: center, center;
        background-repeat: no-repeat, no-repeat;
        overflow: hidden;
      }

      .wordmark {
        position: absolute;
        top: 42px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 18px;
        color: var(--ink-3);
        letter-spacing: 0.01em;
      }
      .wordmark .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(23, 147, 209, 0.7);
      }

      .stage {
        position: absolute;
        left: 80px;
        top: 50%;
        transform: translateY(-50%);
        max-width: 640px;
      }
      .name {
        font-size: 72px;
        font-weight: 700;
        line-height: 1.0;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      .role {
        font-family: var(--mono);
        font-size: 21px;
        color: var(--ink-5);
        margin-top: 16px;
      }
      .tagline {
        font-size: 29px;
        line-height: 1.34;
        color: var(--ink-3);
        margin-top: 38px;
        max-width: 560px;
      }
      .tagline span { color: var(--accent-2); }
      .meta {
        font-family: var(--mono);
        font-size: 17px;
        color: var(--ink-5);
        margin-top: 34px;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <span class="wordmark"><span class="dot"></span>jcrenshaw.dev</span>
    <div class="stage">
      <div class="name">weathervane</div>
      <div class="role">weather data as clean Rust types</div>
      <p class="tagline">You call the async functions, you get back clean Rust types. <span>That's it.</span></p>
      <div class="meta">v{{WEATHERVANE_VERSION}} &nbsp;·&nbsp; Rust &nbsp;·&nbsp; MIT / Apache-2.0</div>
    </div>
  </body>
</html>
